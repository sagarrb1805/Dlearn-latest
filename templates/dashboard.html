<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Upload</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
    }

    header {
      background-color: #ffffff;
      padding: 16px 32px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      position: relative;
      z-index: 2;
    }

    header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
      color: #007bff;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 16px;
      align-items: center;
    }

    nav ul li a {
      text-decoration: none;
      color: #007bff;
      padding: 8px 16px;
      border: 1px solid #007bff;
      border-radius: 6px;
      transition: 0.3s;
      font-size: 14px;
    }

    nav ul li:last-child {
      margin-left: auto;
    }

    nav ul li a:hover {
      background-color: #007bff;
      color: white;
    }

    .hero {
      position: relative;
      height: 670px;
      background: url('{{ url_for("static", filename="uploads/homeimage.jpg") }}') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

    .hero-overlay {
      background: rgba(0, 0, 0, 0.8);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .main-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .button-group {
        display: flex;
        flex-direction: row; /* Horizontal layout */
        gap: 50px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap; /* Optional: wraps to next line on small screens */
        }


    .dashboard-btn {
      padding: 60px 28px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #ffcc00;
      color: #000;
      transition: 0.3s;
      text-decoration: none;
      min-width: 280px;
      min-height: 150px;
      font-weight: bold;
      font-size: x-large;    }

    .dashboard-btn:hover {
      background-color:#ff9900;
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
    <h1>DLearn</h1>
      <nav>
        <ul>
          <li style="margin-left:auto;"><a href="{{ url_for('student_signup') }}">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="hero">
    <div class="hero-overlay"></div>
    <div class="main-content">
      <div class="button-group">
        <a href="{{ url_for('studentdetails') }}" class="dashboard-btn">Student Details</a>
        <a href="{{ url_for('resource_route.create_resource') }}" class="dashboard-btn">Create Resource</a>
        <a href="{{ url_for('student_route.create_student') }}" class="dashboard-btn">Create Student</a>
      </div>
    </div>
  </div>
</body>
</html>
