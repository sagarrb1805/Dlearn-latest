<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <div class="left">
            <img src="{{ 'https://img.freepik.com/free-vector/privacy-policy-concept-illustration_114360-7853.jpg?t=st=1719833106~exp=1719836706~hmac=485d6e5900133320438b3f1263c3bf7d999733bcaab5a79a685240b742d15917&w=740' }}" alt="Signup Image">
        </div>
        <div class="right">
            <h2>Admin Login</h2>
            <form action="/admin_login" method="post">
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username" required><br>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required><br><br>
                <button type="submit">Log In</button>
                
            </form>
        </div>
    </div>
</body>
</html>
